version: 2

models:
  - name: dim_customer
    columns:
      - name: customer_key
        data_tests: [not_null, unique]
  - name: dim_seller
    columns:
      - name: seller_key
        data_tests: [not_null, unique]
  - name: dim_product
    columns:
      - name: product_key
        data_tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [not_null, unique]

  - name: fact_order_items
    columns:
      - name: order_item_key
        data_tests: [not_null, unique]
      - name: customer_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: product_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_key
      - name: seller_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_seller')
                field: seller_key
      - name: purchase_date_key
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_key

  - name: fact_payments
    columns:
      - name: payment_key
        data_tests: [not_null, unique]